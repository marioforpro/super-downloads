      // title bar 28 base px, rows every 74.5 base px from y 8 inside the list.
      const S = 2.08, WX = 41, WY = 540 + 28 * S, LIST = 51;
      const app = (bx, by) => [WX + bx * S, WY + by * S];
      const PITCH = 74.5;
      const CAM = { s: 1.045, ox: 540, oy: 840 };
      const onScreen = ([x, y]) => [CAM.ox + CAM.s * (x - CAM.ox), CAM.oy + CAM.s * (y - CAM.oy)];
      const INPUT = app(111, 25.5);

      // ── Arrival: colour flood from the capsule, the window rises under it ──
      tl.fromTo("#a-world", { clipPath: "circle(0% at 540px 640px)" }, { clipPath: "circle(150% at 540px 640px)", duration: 0.5, ease: "power2.inOut" }, G(3.5));
      tl.fromTo("#a-win", { y: 320, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, G(3.55));
      tl.fromTo("#a-glow", { opacity: 0 }, { opacity: 0.55, duration: 1.2, ease: "power2.out" }, G(3.7));

      // The capsule from the browser (same place, same size) arcs into the URL field.
      tl.set("#a-cap0", { x: 540, y: 640, xPercent: -50, yPercent: -50, scale: 1 }, 0);
      tl.set("#a-cap0", { opacity: 1 }, G(3.5));
      tl.to("#a-cap0", { x: INPUT[0] + 40, duration: 0.6, ease: "power2.inOut" }, G(3.75));
      tl.to("#a-cap0", { y: INPUT[1], scale: 0.7, duration: 0.6, ease: "power3.inOut" }, G(3.75));
      tl.to("#a-cap0", { opacity: 0, duration: F(4), ease: "none" }, G(4.35) - F(2));
      tl.to("#a-top-ready", { opacity: 1, duration: F(4), ease: "none" }, G(4.35) - F(2));
      tl.to("#a-top-empty", { opacity: 0, duration: F(4), ease: "none" }, G(4.35) - F(2));

      // ── Titles: blur to sharp on the beat, dead still, blur out ──
      const title = (id, inAt, outAt) => {
        tl.fromTo(id, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: F(5), ease: "power2.out" }, G(inAt));
        tl.to(id, { opacity: 0, filter: "blur(10px)", duration: F(5), ease: "power2.in" }, G(outAt));
      };
      title("#a-t-switch", 3.9, 4.85);
      title("#a-t-enter", 5.0, 7.3);
      title("#a-t-ready", 8.12, 8.75);
      title("#a-t-batch", 9.0, 11.35);
      title("#a-t-many", 11.55, 13.6);

      // ── Keycaps ──
      const keyIn = (id, at) => tl.fromTo(id, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, G(at));
      const keyOut = (id, at) => tl.to(id, { opacity: 0, y: 24, duration: F(8), ease: "sine.in" }, G(at));
      const press = (cap, at, hold) => {
        tl.to(cap, { y: 6, boxShadow: "0 2px 0 #9fb0cc, 0 6px 14px rgba(0,0,0,0.35)", duration: F(4), ease: "power2.in" }, G(at) - F(4));
        tl.to(cap, { y: 0, boxShadow: "0 8px 0 #9fb0cc, 0 18px 34px rgba(0,0,0,0.35)", duration: F(8), ease: "expo.out" }, G(at) + hold);
      };
      keyIn("#a-kret", 4.55);
      press("#a-kret-cap", 5.0, 0.12);
      keyOut("#a-kret", 6.2);
      keyIn("#a-kcmd", 8.45);
      keyIn("#a-kb", 8.5);
      press("#a-kcmd-cap", 8.85, 0.3);
      press("#a-kb-cap", 9.0, 0.12);
      keyOut("#a-kb", 9.45);
      keyIn("#a-kc", 9.6);
      for (const at of [10.0, 10.5, 11.0]) {
        press("#a-kcmd-cap", at - 0.12, 0.2);
        press("#a-kc-cap", at, 0.1);
      }
      keyOut("#a-kcmd", 11.6);
      keyOut("#a-kc", 11.62);

      // ── Enter: the button presses, the field clears, the row arrives and downloads ──
      tl.to("#a-top-ready", { opacity: 0, duration: F(3), ease: "none" }, G(5.1));
      tl.to("#a-top-empty", { opacity: 1, duration: F(3), ease: "none" }, G(5.1));
      tl.to("#a-empty", { opacity: 0, duration: F(4), ease: "none" }, G(5.1));
      const rowIn = (slot, at) => tl.fromTo(slot, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, G(at));
      rowIn("#a-slot-s", 5.1);

      // Progress bars and their counters: linear, the counter set frame by frame.
      const progress = (fill, pct, from, to) => {
        tl.fromTo(fill, { width: "2%" }, { width: "100%", duration: to - from, ease: "none" }, G(from));
        const frames = Math.round((to - from) * 30);
        for (let f = 0; f <= frames; f += 1) tl.set(pct, { textContent: Math.round((f / frames) * 100) + "%" }, G(from) + f / 30);
      };
      progress("#sdl-fill", "#sdl-pct", 5.15, 7.0);
      tl.to("#a-s-cv", { opacity: 1, duration: F(3), ease: "none" }, G(7.0) - F(1));
      tl.to("#a-slot-s > .download-item", { opacity: 0, duration: F(3), ease: "none" }, G(7.0) - F(1));
      tl.fromTo("#scv-fill", { width: "0%" }, { width: "100%", duration: 0.95, ease: "none" }, G(7.0));
      tl.to("#a-s-ok", { opacity: 1, duration: F(3), ease: "none" }, G(8.0) - F(1));
      tl.to("#a-s-cv", { opacity: 0, duration: F(3), ease: "none" }, G(8.0) - F(1));
      tl.fromTo("#a-slot-s", { scale: 1 }, { scale: 1.02, duration: F(4), ease: "power2.out", transformOrigin: "50% 50%" }, G(8.0));
      tl.to("#a-slot-s", { scale: 1, duration: F(10), ease: "power2.out" }, G(8.0) + F(4));

      // ── Batch mode on: the real toggle + ribbon ──
      tl.to("#a-top-batch", { opacity: 1, duration: F(3), ease: "none" }, G(9.0));
      tl.to("#a-top-empty", { opacity: 0, duration: F(3), ease: "none" }, G(9.0));
      tl.fromTo("#a-ribbon-wrap .auto-add-ribbon", { opacity: 0 }, { opacity: 1, duration: F(6), ease: "power2.out" }, G(9.05));

      // ── Three links rain in: each capsule drops into the field, its row arrives on top ──
      const rain = [["#a-cap1", "#a-slot-b1", "#b1-fill", "#b1-pct", "#a-b1-ok", 12.6],
                    ["#a-cap2", "#a-slot-b2", "#b2-fill", "#b2-pct", "#a-b2-ok", 13.0],
                    ["#a-cap3", "#a-slot-b3", "#b3-fill", "#b3-pct", "#a-b3-ok", 13.4]];
      const order = ["#a-slot-s"];
      rain.forEach(([cap, slot, fill, pct, ok, done], i) => {
        const land = 10.25 + i * 0.5;
        tl.set(cap, { x: INPUT[0] + 40, y: -90, xPercent: -50, yPercent: -50, scale: 0.72 }, 0);
        tl.set(cap, { opacity: 1 }, G(land - 0.28));
        tl.to(cap, { y: INPUT[1], duration: 0.28, ease: "power3.in" }, G(land - 0.28));
        tl.to(cap, { opacity: 0, scale: 0.6, duration: F(4), ease: "power2.out" }, G(land));
        // Everything already in the list moves down one row; the new row takes the top.
        order.forEach((s, k) => tl.to(s, { y: (k + 1) * PITCH, duration: 0.3, ease: "power3.out" }, G(land)));
        rowIn(slot, land + F(1));
        order.unshift(slot);
        progress(fill, pct, land + 0.05, done);
        tl.to(ok, { opacity: 1, duration: F(3), ease: "none" }, G(done) - F(1));
        tl.to(slot + " > .download-item", { opacity: 0, duration: F(3), ease: "none" }, G(done) - F(1));
      });

      tl.to("#a-scale", { height: 387, duration: 0.3, ease: "power3.out" }, G(11.25));
      tl.to("#a-scale .sd-app", { height: 359, duration: 0.3, ease: "power3.out" }, G(11.25));
      tl.to("#a-scale .download-list", { height: 308, duration: 0.3, ease: "power3.out" }, G(11.25));

      // ── Camera: punch in on the row while it downloads and converts, pull back for Batch,
      //    then one slow push that ends exactly at the drag's framing (CAM). Never a dead stop. ──
      tl.fromTo("#a-cam", { scale: 1, x: 0, y: 0 }, { scale: 1.45, x: 200, y: 110, duration: 0.7, ease: "power2.inOut" }, G(5.15));
      tl.to("#a-cam", { scale: 1.48, x: 204, y: 114, duration: 2.6, ease: "none" }, G(5.85));
      tl.to("#a-cam", { scale: 1, x: 0, y: 0, duration: 0.6, ease: "power2.inOut" }, G(8.45));
      tl.to("#a-cam", { scale: CAM.s, duration: G(13.4) - G(9.05), ease: "power1.inOut" }, G(9.05));

      // ── Drag Spring out (now in slot 4) → it carries us into the timeline ──
      const thumb = onScreen(app(15 + 45, LIST + 8 + 3 * PITCH + 7 + 25.5));
      const tw = 90 * S * CAM.s, th = 51 * S * CAM.s;
      tl.set("#a-cursor", { x: 1000, y: 1900 }, 0);
      tl.set("#a-cursor", { opacity: 1 }, G(13.35));
      tl.to("#a-cursor", { x: thumb[0] + 30, y: thumb[1] + 10, duration: 0.55, ease: "power3.inOut" }, G(13.35));
      tl.to("#a-cursor", { scale: 0.86, duration: F(2), ease: "power2.in", transformOrigin: "0 0" }, G(13.95));
      tl.set("#a-drag", { x: thumb[0] - tw / 2, y: thumb[1] - th / 2, width: tw, height: th }, 0);
      tl.set("#a-drag", { opacity: 1 }, G(14.0));
      tl.to("#a-drag", { scale: 1.12, duration: F(4), ease: "power2.out" }, G(14.0));
      // Hand-off point to «timeline»: the clip's centre at the layout's drag point, still at 1.12×.
      tl.to("#a-drag", { x: 300 - tw / 2, y: 1240 - th / 2, duration: 0.48, ease: "power2.inOut" }, G(14.12));
      tl.to("#a-cursor", { x: 300 + 30, y: 1240 + 10, duration: 0.48, ease: "power2.inOut" }, G(14.12));
      tl.set(["#a-drag", "#a-cursor"], { opacity: 0 }, G(14.6));
      // The app world leaves upward with blur while the timeline rises (scene «timeline»).
      tl.to(["#a-cam", "#a-left"], { y: -900, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, G(14.1));

      window.__timelines["v-app"] = tl;
    })();
  </script>
</template>
