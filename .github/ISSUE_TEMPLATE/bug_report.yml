name: Bug report
description: A reproducible problem with the app (for help, email support@superdownloads.app)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste private links, emails or account details here: this repository is public. For anything private, write to support@superdownloads.app."
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the top of Settings
      placeholder: "1.5.5"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce. A public example link helps most.
    validations:
      required: true
