<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* 3 % grain stepped at 15 fps (hand-timed texture), 8 % vignette. */
    #f-grain {
      position: absolute;
      inset: -64px;
      background: url("assets/img/grain.png") 0 0 / 512px 512px repeat;
      opacity: 0.045;
      mix-blend-mode: overlay;
    }
    #f-vig {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.16) 100%);
    }
  </style>
  <div id="root" data-composition-id="v-film" data-width="1080" data-height="1920" data-layout-ignore>
    <div id="f-grain"></div>
    <div id="f-vig"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Deterministic jumps: offset k is a function of the step index only.
      for (let i = 0; i < 24 * 15; i++) {
        const x = ((i * 197) % 64) - 32;
        const y = ((i * 131) % 64) - 32;
        tl.set("#f-grain", { x: x, y: y }, i / 15);
      }
      window.__timelines["v-film"] = tl;
    })();
  </script>
</template>
