<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- «Links become clips», 9:16 recomposition for Instagram/TikTok — SPEC.md. Same timing and sound as index.html. -->
    <div id="root" data-composition-id="v-main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <div id="v-browser" data-composition-id="v-browser" data-composition-src="compositions/v-browser.html"
        data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="v-app" data-composition-id="v-app" data-composition-src="compositions/v-app.html"
        data-start="3.4" data-duration="11.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="v-timeline" data-composition-id="v-timeline" data-composition-src="compositions/v-timeline.html"
        data-start="14" data-duration="6.4" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="v-endcard" data-composition-id="v-endcard" data-composition-src="compositions/v-endcard.html"
        data-start="19.8" data-duration="4.2" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="v-film" data-composition-id="v-film" data-composition-src="compositions/v-film.html"
        data-start="0" data-duration="24" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 10"></div>

      <!-- Sound on visible actions only (assets/sfx, Pixabay licence). Peaks one frame after the picture. -->
      <audio id="sfx-k1" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="1.7" data-volume="0.7" data-track-index="10"></audio>
      <audio id="sfx-k2" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="2.0" data-volume="0.8" data-track-index="11"></audio>
      <audio id="sfx-lift" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="2.02" data-volume="0.35" data-track-index="12"></audio>
      <audio id="sfx-k3" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="2.85" data-volume="0.7" data-track-index="10"></audio>
      <audio id="sfx-k4" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="3.0" data-volume="0.8" data-track-index="11"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-duration="0.57" data-start="3.42" data-volume="0.6" data-track-index="12"></audio>
      <audio id="sfx-land" class="clip" src="assets/sfx/click-soft.mp3" data-duration="0.36" data-start="4.38" data-volume="0.6" data-track-index="13"></audio>
      <audio id="sfx-k5" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="5.0" data-volume="0.9" data-track-index="10"></audio>
      <audio id="sfx-done" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="8.0" data-volume="0.45" data-track-index="14"></audio>
      <audio id="sfx-k6" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="8.85" data-volume="0.7" data-track-index="11"></audio>
      <audio id="sfx-k7" class="clip" src="assets/sfx/key-press.mp3" data-duration="0.4" data-start="9.0" data-volume="0.8" data-track-index="10"></audio>
      <audio id="sfx-r1" class="clip" src="assets/sfx/click-soft.mp3" data-duration="0.36" data-start="10.25" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-r2" class="clip" src="assets/sfx/click-soft.mp3" data-duration="0.36" data-start="10.75" data-volume="0.45" data-track-index="15"></audio>
      <audio id="sfx-r3" class="clip" src="assets/sfx/click-soft.mp3" data-duration="0.36" data-start="11.25" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-d1" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="12.6" data-volume="0.35" data-track-index="14"></audio>
      <audio id="sfx-d2" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="13.0" data-volume="0.3" data-track-index="16"></audio>
      <audio id="sfx-d3" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="13.4" data-volume="0.35" data-track-index="14"></audio>
      <audio id="sfx-rise" class="clip" src="assets/sfx/riser.mp3" data-start="12.0" data-duration="2.9" data-volume="0.35" data-fade-in="1.5" data-track-index="17"></audio>
      <audio id="sfx-world" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="14.0" data-duration="1.6" data-volume="0.5" data-track-index="12"></audio>
      <audio id="sfx-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-duration="2.1" data-start="14.9" data-volume="0.55" data-track-index="18"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-duration="2.1" data-start="20.3" data-volume="0.7" data-track-index="18"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["v-main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
