  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const L = (g) => g - 14; // scene clock = film clock - 14 s
      const F = (f) => f / 30;

      // The editing world rises from below as the app world leaves upward.
      tl.fromTo("#t-world", { y: 1080 }, { y: 0, duration: 0.62, ease: "power3.inOut" }, L(14.08));

      // Hand-off: same clip, same place as scene «app» left it, then it becomes the V1 clip.
      tl.set("#t-drag", { x: 560 - 121.1, y: 820 - 68.6, width: 242.2, height: 137.3, opacity: 1 }, L(14.6));
      tl.set("#t-cursor", { x: 590, y: 830, opacity: 1 }, L(14.6));
      tl.to("#t-drag", { x: 160, y: 664, width: 464, height: 120, duration: 0.32, ease: "power3.inOut" }, L(14.6));
      tl.to("#t-cursor", { x: 360, y: 724, duration: 0.32, ease: "power3.inOut" }, L(14.6));
      tl.to("#t-cursor", { scale: 1, duration: F(4) }, L(14.92));
      tl.to("#t-cursor", { x: 520, y: 1140, opacity: 0, duration: 0.5, ease: "power2.in" }, L(15.0));
      // Snap with a small settle (spring, damping ~0.75).
      tl.to("#t-drag", { scale: 1.03, duration: F(3), ease: "power2.out" }, L(14.92));
      tl.to("#t-drag", { scale: 1, duration: F(9), ease: "back.out(1.6)" }, L(14.92) + F(3));
      tl.to("#t-drag", { borderColor: "rgba(140,208,255,0.6)", boxShadow: "0 0 0 rgba(0,0,0,0)", borderWidth: 2, duration: F(8) }, L(14.95));

      // The rest of the downloads land after it, then the audio.
      ["#t-c2", "#t-c3", "#t-c4"].forEach((c, i) =>
        tl.fromTo(c, { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, L(15.05) + i * F(4)));
      ["#t-a1", "#t-a2", "#t-a3", "#t-a4"].forEach((c, i) =>
        tl.fromTo(c, { opacity: 0, scaleX: 0.92 }, { opacity: 1, scaleX: 1, transformOrigin: "0 50%", duration: 0.4, ease: "expo.out" }, L(15.1) + i * F(4)));

      // Payoff: the monitor opens and the downloaded film plays.
      tl.fromTo("#t-monitor", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, L(14.7));
      tl.fromTo("#t-play", { opacity: 0 }, { opacity: 1, duration: F(5) }, L(14.95));
      tl.fromTo("#t-play", { x: 0 }, { x: 440, duration: 5.2, ease: "none" }, L(15.0));
      for (let f = 0; f <= 5.2 * 30; f += 1) {
        const s = f / 30, ff = f % 30;
        const tc = "00:00:" + String(Math.floor(s)).padStart(2, "0") + ":" + String(ff).padStart(2, "0");
        tl.set("#t-tc", { textContent: tc }, L(15.0) + s);
      }

      // Titles: blur to sharp, dead still.
      tl.fromTo("#t-title", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: F(5), ease: "power2.out" }, L(15.2));
      tl.fromTo("#t-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: F(5), ease: "power2.out" }, L(15.45));
      tl.to(["#t-title", "#t-sub"], { opacity: 0, filter: "blur(10px)", duration: F(5), ease: "power2.in" }, L(18.35));

      // Platforms: «From YouTube / to …» rolls like a slot machine and lands on LinkedIn.
      tl.fromTo("#t-roll", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: F(5), ease: "power2.out" }, L(18.55));
      const words = ["#t-r0", "#t-r1", "#t-r2", "#t-r3", "#t-r4", "#t-r5"];
      let at = L(18.55);
      const steps = [4, 4, 4, 5, 6, 0];
      words.forEach((w, i) => {
        tl.fromTo(w, { opacity: 1, yPercent: 100 }, { yPercent: 0, duration: F(3), ease: "power2.out" }, at);
        if (steps[i]) {
          tl.to(w, { yPercent: -100, duration: F(3), ease: "power2.in" }, at + F(steps[i]));
          at += F(steps[i]) + F(1);
        }
      });

      window.__timelines["timeline"] = tl;
    })();
  </script>
